# PeopleDesk database configuration (EXAMPLE FILE - contains no real password)
#
# HOW TO USE:
#   1. Copy this file to:  src/main/resources/config.properties
#   2. Replace the username and password with YOUR local MySQL login.
#   3. Rebuild the WAR (mvn clean package) and redeploy.
#
# config.properties is listed in .gitignore, so it will not be committed to Git.
# (Alternative: set the environment variables PEOPLEDESK_DB_URL, PEOPLEDESK_DB_USER and
#  PEOPLEDESK_DB_PASSWORD. Environment variables win over this file.)

db.url=jdbc:mysql://localhost:3306/peopledesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.username=root
db.password=CHANGE_ME
